name: Scraper Cron

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
      SERP_PROVIDER: serpapi
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DB_ALLOW_SELF_SIGNED_CERT: ${{ secrets.DB_ALLOW_SELF_SIGNED_CERT || 'false' }}
      SCRAPER_MAX_COMPANIES_PER_RUN: "25"
      SCRAPER_TARGET_CITY: "Cordoba,Cordoba Province,Argentina"
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run scraping pipeline
        run: npm run scraper:run
