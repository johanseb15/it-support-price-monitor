name: Scraper Cron

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
      SERP_PROVIDER: serpapi
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DB_ALLOW_SELF_SIGNED_CERT: ${{ secrets.DB_ALLOW_SELF_SIGNED_CERT || 'false' }}
      SCRAPER_MAX_COMPANIES_PER_RUN: "25"
      SCRAPER_TARGET_CITY: "Cordoba,Cordoba Province,Argentina"
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate required secrets before install
        run: |
          # Check all required secrets exist and are not empty
          node -e "
            const required = ['DATABASE_URL', 'SERP_API_KEY', 'CRON_SECRET'];
            const errors = [];
            
            for (const key of required) {
              const value = process.env[key];
              if (!value || !value.trim()) {
                errors.push(key);
              }
            }
            
            // Validate DATABASE_URL is a valid PostgreSQL URL
            try {
              const dbUrl = process.env.DATABASE_URL?.trim();
              if (dbUrl) {
                const url = new URL(dbUrl);
                if (!['postgresql:', 'postgres:'].includes(url.protocol)) {
                  errors.push('DATABASE_URL must use postgresql:// or postgres:// protocol');
                }
              }
            } catch (e) {
              errors.push('DATABASE_URL is not a valid URL: ' + e.message);
            }
            
            if (errors.length > 0) {
              console.error('[GitHub Actions] Pre-install validation failed:');
              errors.forEach(err => console.error('  ✗ ' + err));
              console.error('');
              console.error('Configure these GitHub Secrets:');
              console.error('  - DATABASE_URL (valid PostgreSQL connection string)');
              console.error('  - SERP_API_KEY (from https://serpapi.com)');
              console.error('  - CRON_SECRET (random bearer token for webhook auth)');
              console.error('  - Optional: DB_ALLOW_SELF_SIGNED_CERT (true|false)');
              process.exit(1);
            }
            
            console.log('[GitHub Actions] ✓ All required secrets are valid');
          "

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate runtime environment
        run: npm run env:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraping pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DB_ALLOW_SELF_SIGNED_CERT: ${{ secrets.DB_ALLOW_SELF_SIGNED_CERT || 'false' }}
        run: npm run scraper:run
