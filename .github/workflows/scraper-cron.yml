name: Scraper Cron

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
    steps:
      - name: Trigger production scraper
        run: |
          test -n "$APP_BASE_URL"
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$APP_BASE_URL/api/scraper/run"
