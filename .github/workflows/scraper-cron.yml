name: Scraper Cron

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: https://monitor-precios-it.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger production scraper
        run: |
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$APP_BASE_URL/api/scraper/run"
