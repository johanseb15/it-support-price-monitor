name: Scraper Cron

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
      SERP_PROVIDER: serpapi
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DB_ALLOW_SELF_SIGNED_CERT: ${{ secrets.DB_ALLOW_SELF_SIGNED_CERT || 'false' }}
      SCRAPER_MAX_COMPANIES_PER_RUN: "25"
      SCRAPER_TARGET_CITY: "Cordoba,Cordoba Province,Argentina"
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate required secrets before install
        run: |
          node -e "const required=['DATABASE_URL','SERP_API_KEY','CRON_SECRET']; for (const key of required) { if (!process.env[key] || !process.env[key].trim()) { console.error('[env] Missing required secret: '+key); process.exit(1); } } try { const url = new URL(process.env.DATABASE_URL); if (!['postgresql:','postgres:'].includes(url.protocol)) throw new Error('Invalid protocol'); } catch { console.error('[env] Missing or invalid DATABASE_URL. Configure the DATABASE_URL GitHub secret with a valid PostgreSQL connection string.'); process.exit(1); } console.log('[env] Required secrets look valid.');"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate runtime environment
        run: npm run env:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraping pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DB_ALLOW_SELF_SIGNED_CERT: ${{ secrets.DB_ALLOW_SELF_SIGNED_CERT || 'false' }}
        run: npm run scraper:run
